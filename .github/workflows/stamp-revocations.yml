#
# Daily stamp of the Rhodolite Studio revocation list (SPEC §34.17). Lives in the public licence repository
# wnsflr/rhodolite-studio-license, next to revocations.json.
#
# * revocations.json is published by the OWNER (Owner Tool "publish", signed with the owner key on the owner's laptop).
#   Every app version reads it. This workflow never changes it.
# * Every day this workflow checks the owner's signature on revocations.json and writes revocations-v2.json: the same
#   list plus a timestamp ("stamp") signed with a separate, revocation-only key. Its private half exists only as the
#   Actions secret REVOCATION_STAMP_KEY; the owner key is never used here. A stamp cannot add or remove revoked
#   licences; it only shows the list is current. Rhodolite Studio 0.5.1+ reads it; a stamp older than 30 days only shows
#   a soft note in the app (the 30-day offline grace is its only lock). It never stamps a list older than the stamped one.
# * Also runs when a new revocations.json is pushed (so a revocation is stamped within minutes), and by hand (Actions
#   tab -> Run workflow; tick "dry run" to check everything without committing). Pushing this workflow, the tool or
#   stamp-config.json starts nothing by itself: the first run is a manual dry run (REVOCATION_SETUP.md).
# * Free: GitHub Actions minutes are free for public repositories. GitHub disables scheduled workflows in a public
#   repository after 60 days without activity; the daily commit of revocations-v2.json is that activity.
name: stamp-revocations

on:
  schedule:
    - cron: "23 4 * * *"   # daily, 04:23 UTC (off the full hour, when GitHub's scheduler is busiest)
  push:
    branches: [main]
    paths:
      - revocations.json
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run: check and sign, but write and commit nothing"
        type: boolean
        default: false

permissions:
  contents: write   # commit revocations-v2.json; nothing else

concurrency:
  group: stamp-revocations
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Every action is pinned to a full commit SHA (the tag it was on is in the comment): a moved or compromised tag
      # can never run other code in this job, which holds REVOCATION_STAMP_KEY. To update one, look up the new tag's
      # commit (git ls-remote https://github.com/actions/checkout refs/tags/vX.Y.Z) and replace the SHA and comment.
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          ref: main        # the newest main: a push run queued behind another run stamps the latest list, not its own
          fetch-depth: 1

      - name: Python with cryptography
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install the one dependency (pinned by hash)
        run: |
          python -m pip install --disable-pip-version-check --no-input --only-binary=:all: --no-deps --require-hashes -r tools/stamp-requirements.txt

      - name: Self-test (throw-away keys)
        run: python tools/revocation_stamp.py selftest

      - name: Stamp (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        env:
          REVOCATION_STAMP_KEY: ${{ secrets.REVOCATION_STAMP_KEY }}
        run: >-
          python tools/revocation_stamp.py stamp --config stamp-config.json --list revocations.json
          --out revocations-v2.json --dry-run

      - name: Stamp
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          REVOCATION_STAMP_KEY: ${{ secrets.REVOCATION_STAMP_KEY }}
        run: |
          python tools/revocation_stamp.py stamp --config stamp-config.json --list revocations.json --out revocations-v2.json
          python tools/revocation_stamp.py verify --config stamp-config.json --file revocations-v2.json --list revocations.json --max-age-days 1

      - name: Commit revocations-v2.json
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add revocations-v2.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "Stamp the revocation list ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            # someone pushed in between (e.g. a new revocations.json, whose own push run is queued behind this one and
            # checks out the newest main, so it stamps that list next): put this stamp on top and retry the push
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
